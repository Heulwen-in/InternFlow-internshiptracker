services:
  postgres:
    image: postgres:16
    container_name: internflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-internflow_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-internflow_user} -d ${POSTGRES_DB:-internflow_tracker}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
